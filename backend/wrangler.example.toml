name = "backend"
main = "src/index.ts"
compatibility_date = "2023-12-01"

# Public, non-secret config can live in [vars]. For SECRETS — DATABASE_URL,
# JWT_SECRET — prefer `wrangler secret put <NAME>` so they end up encrypted in
# Cloudflare instead of in this file. The placeholders below exist only so
# `wrangler dev` can pick them up locally; copy this file to wrangler.toml and
# fill in real values (which are gitignored).
[vars]
DATABASE_URL = "prisma://accelerate.prisma-data.net/?api_key=YOUR_ACCELERATE_KEY"
JWT_SECRET = "change-me-to-a-long-random-string"
# Comma-separated list of origins allowed to call /api/*. If unset, only
# http://localhost:5173 is allowed. Add your deployed frontend domain here.
ALLOWED_ORIGINS = "http://localhost:5173"
# Bearer secret for POST /api/v1/admin/ingest (manual RSS ingest).
# In production prefer `wrangler secret put INGEST_SECRET`.
INGEST_SECRET = "change-me-to-a-long-random-string"

# Cloudflare cron triggers. The Worker also fires `scheduled` every 6h
# and runs the same ingest. Format: standard cron in UTC.
[triggers]
crons = ["0 */6 * * *"]

# Optional Cloudflare Workers KV binding used for per-IP rate limiting on
# /signin and /signup. To turn on:
#   1. wrangler kv:namespace create RATE_LIMITER
#   2. wrangler kv:namespace create RATE_LIMITER --preview
#   3. paste the resulting ids below and uncomment.
# Without this binding the worker falls back to a per-isolate in-memory
# counter -- imperfect (each isolate has its own bucket) but better than
# nothing.
# [[kv_namespaces]]
# binding = "RATE_LIMITER"
# id = "..."
# preview_id = "..."
